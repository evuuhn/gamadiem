<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#d90a0a">
    <title>Settings — Gamadiem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/settings.css">
  </head>
  <body class="settings-page">
    <aside class="sidebar">
      <a class="brand" href="dashboard.html" aria-label="Gamadiem home">
        <span class="brand-icon">
          <img src="assets/gamadiem-logo.svg" alt="">
        </span>
        <span class="brand-name">Gamadiem</span>
      </a>

      <nav class="navigation" aria-label="Main navigation">
        <a class="nav-item" href="dashboard.html">
          <img src="assets/sidebar-dashboard.png" alt="">
          <span>Dashboard</span>
        </a>
        <a class="nav-item" href="history.html">
          <img src="assets/sidebar-history.png" alt="">
          <span>History</span>
        </a>
        <a class="nav-item recommendation" href="recommendation.html">
          <img src="assets/sidebar-food.png" alt="">
          <span>Food Recommendation</span>
        </a>
        <a class="nav-item active" href="settings.html" aria-current="page">
          <img src="assets/sidebar-settings.png" alt="">
          <span>Settings</span>
        </a>
        <a class="nav-item" href="#" id="logoutLink">
          <img src="assets/sidebar-logout.png" alt="">
          <span>Logout</span>
        </a>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <label class="search" for="searchInput">
          <img src="assets/search-icon.png" alt="">
          <input id="searchInput" type="search" placeholder="Search for anything..." aria-label="Search">
        </label>
        <div class="topbar-user" aria-label="Signed-in user">
          <span class="topbar-avatar" data-user-initial aria-hidden="true"></span>
          <span class="topbar-user-name" data-user-name></span>
        </div>
      </header>

      <main class="content settings-content">
        <h1 class="settings-title">Settings</h1>

        <section class="settings-panel" aria-labelledby="settingsPanelTitle">
          <img class="settings-star pixel-art" src="assets/pixel-star.png" alt="" aria-hidden="true">
          <h2 id="settingsPanelTitle">User Profile</h2>
          <form id="settingsForm" class="settings-form">
            <div class="settings-field">
              <label for="settingsName">Name:</label>
              <input id="settingsName" type="text" autocomplete="name" maxlength="80" required>
            </div>
            <div class="settings-field">
              <label for="cycleDurationDays">Cycle Duration (Days):</label>
              <input id="cycleDurationDays" type="number" min="1" max="365" step="1" required>
            </div>
            <div class="settings-field">
              <label for="totalAllowance">Total Allowance (Rp):</label>
              <input id="totalAllowance" class="money-input" type="text" inputmode="numeric" pattern="[0-9.]*" autocomplete="off" required>
            </div>
            <div class="settings-field">
              <label for="savingTarget">Savings Target (Rp):</label>
              <input id="savingTarget" class="money-input" type="text" inputmode="numeric" pattern="[0-9.]*" autocomplete="off" required>
            </div>
            <div class="settings-field">
              <label for="rentPrice">Rent for A Room (Rp):</label>
              <input id="rentPrice" class="money-input" type="text" inputmode="numeric" pattern="[0-9.]*" autocomplete="off" required>
            </div>
            <div class="settings-field">
              <label for="electricity">Electricity (Rp):</label>
              <input id="electricity" class="money-input" type="text" inputmode="numeric" pattern="[0-9.]*" autocomplete="off" required>
            </div>
            <button type="submit" class="settings-save">
              <img src="assets/settings-save-button.svg" alt="" aria-hidden="true">
              <span>SAVE CHANGES</span>
            </button>
          </form>
          <img class="settings-cash" src="assets/settings-cash.svg" alt="" aria-hidden="true">
        </section>
      </main>
    </div>

    <div class="feedback" id="feedback" role="status" aria-live="polite"></div>
    <div class="logout-modal hidden" id="logoutModal" aria-hidden="true">
      <section class="logout-dialog" role="dialog" aria-modal="true" aria-labelledby="logoutTitle" aria-describedby="logoutMessage">
        <h2 id="logoutTitle">Log Out</h2>
        <p id="logoutMessage">Are you sure you want to log out?</p>
        <div class="logout-actions">
          <button type="button" class="logout-confirm" id="confirmLogout">I'm Sure</button>
          <button type="button" class="logout-cancel" id="cancelLogout">Cancel</button>
        </div>
      </section>
    </div>
    <script src="js/finance.js"></script>
    <script src="js/settings.js"></script>
  </body>
</html>
